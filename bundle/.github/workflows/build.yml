name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
              
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Install dependencies
        run: deno install --frozen

      - name: Build development bundle
        run: deno run build --dev
        env:
          VALENCED_DISCORD_SERVER_URL: ${{ vars.VALENCED_DISCORD_SERVER_URL }}
          VALENCED_SOURCE_REPOSITORY_URL: ${{ vars.VALENCED_SOURCE_REPOSITORY_URL }}
          VALENCED_LICENSE_URL: ${{ vars.VALENCED_LICENSE_URL }}
          VALENCED_DEFAULT_PLUGIN_REPOSITORY_URL: ${{ vars.VALENCED_DEFAULT_PLUGIN_REPOSITORY_URL }}

      - name: Upload development bundle
        uses: actions/upload-artifact@v4
        with:
          name: valenced-bundle-development
          path: dist/valenced.bundle
          if-no-files-found: error

      - name: Clear build
        run: rm -rf dist

      - name: Build production bundle
        run: deno run build
        env:
          VALENCED_DISCORD_SERVER_URL: ${{ vars.VALENCED_DISCORD_SERVER_URL }}
          VALENCED_SOURCE_REPOSITORY_URL: ${{ vars.VALENCED_SOURCE_REPOSITORY_URL }}
          VALENCED_LICENSE_URL: ${{ vars.VALENCED_LICENSE_URL }}
          VALENCED_DEFAULT_PLUGIN_REPOSITORY_URL: ${{ vars.VALENCED_DEFAULT_PLUGIN_REPOSITORY_URL }}
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: valenced-bundle
          path: dist/valenced.bundle
          if-no-files-found: error